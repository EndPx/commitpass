# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: commitpass
description: CommitPass event commitments and settlement on Monad testnet
address_format: lowercase
rollback_on_reorg: true
contracts:
  - name: CommitPassFactory
    abi_file_path: ../packages/shared/abi/CommitPassFactory.json
    events:
      - event: VaultCreated
      - event: EventRegistered
      - event: LifecycleRequested
  - name: CommitPassVault
    abi_file_path: ../packages/shared/abi/CommitPassVault.json
    events:
      - event: DepositMade
      - event: RegistrationClosed
      - event: DepositToYieldSource
      - event: AttendanceMarked
      - event: EventSettled
      - event: ClaimAllocated
      - event: SettlementFinalized
      - event: EventCancelled
      - event: RewardClaimed
      - event: OwnershipTransferred
      - event: LifecycleExecuted
chains:
  - id: 10143
    start_block: ${ENVIO_START_BLOCK:-0}
    block_lag: 5
    rpc:
      - url: ${ENVIO_RPC_URL:-https://testnet-rpc.monad.xyz}
        for: sync
        # The public Monad testnet RPC caps eth_getLogs ranges at 100 blocks.
        initial_block_interval: 99
        interval_ceiling: 99
    contracts:
      - name: CommitPassFactory
        address: "${ENVIO_FACTORY_ADDRESS:-0x0000000000000000000000000000000000000000}"
      - name: CommitPassVault
