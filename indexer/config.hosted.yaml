    abi_file_path: ./abi/CommitPassFactory.json
    events:
      - event: VaultCreated
      - event: EventRegistered
      - event: LifecycleRequested
  - name: CommitPassVault
    abi_file_path: ./abi/CommitPassVault.json
    events:
      - event: DepositMade
      - event: RegistrationClosed
      - event: DepositToYieldSource
