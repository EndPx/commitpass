# CRE workflow layout from cre init; validated lifecycle handlers retained.
testnet-settings:
  user-workflow:
    workflow-name: commitpass-testnet
    deployment-registry: private
  workflow-artifacts:
    workflow-path: ./main.ts
    config-path: ./config.testnet.json
    secrets-path: ../secrets.yaml
local-settings:
  user-workflow:
    workflow-name: commitpass-local
  workflow-artifacts:
    workflow-path: ./main.ts
    config-path: ../.local/config.json
    secrets-path: ../local/secrets.example.yaml
interactive-settings:
  user-workflow:
    workflow-name: commitpass-interactive
  workflow-artifacts:
    workflow-path: ./main.ts
    config-path: ../.interactive/config.json
    secrets-path: ../local/secrets.example.yaml

staging-settings:
  user-workflow:
    workflow-name: commitpass-testnet
    deployment-registry: private
  workflow-artifacts:
    workflow-path: ./main.ts
    config-path: ./config.testnet.json
    secrets-path: ../secrets.yaml

local-simulation:
  user-workflow:
    workflow-name: commitpass-receiver-free
    deployment-registry: private
  workflow-artifacts:
    workflow-path: ./health-check.ts
    config-path: ./config.local-simulation.json
    secrets-path: ./secrets.local-simulation.yaml
