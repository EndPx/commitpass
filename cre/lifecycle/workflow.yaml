# CRE workflow layout from cre init; validated lifecycle handlers retained.
testnet-settings:
  user-workflow:
    workflow-name: commitpass-lifecycle-testnet
    deployment-registry: private
  workflow-artifacts:
    workflow-path: ./main.ts
    config-path: ./config.testnet.json
    secrets-path: ../secrets.yaml
local-settings:
  user-workflow:
    workflow-name: commitpass-lifecycle-local
  workflow-artifacts:
    workflow-path: ./main.ts
    config-path: ../.local/config.json
    secrets-path: ../secrets.example.yaml
interactive-settings:
  user-workflow:
    workflow-name: commitpass-interactive-local
  workflow-artifacts:
    workflow-path: ./main.ts
    config-path: ../.interactive/config.json
    secrets-path: ../secrets.example.yaml

staging-settings:
  user-workflow:
    workflow-name: commitpass-lifecycle-testnet
    deployment-registry: private
  workflow-artifacts:
    workflow-path: ./main.ts
    config-path: ./config.testnet.json
    secrets-path: ../secrets.yaml
